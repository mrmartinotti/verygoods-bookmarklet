<!doctype html>
<html><head><meta charset="utf-8"><title>Fourth Listing - CDN Shop</title>
<style>img.main{width:600px;height:750px}</style></head><body>
<!-- Cloudinary-style srcset: commas INSIDE the URLs -->
<img class="main" src="/img/c_fill,w_400/gal-400.jpg"
     srcset="/img/c_fill,w_400/gal-400.jpg 400w, /img/c_fill,w_1200/gal-1200.jpg 1200w, /img/c_fill,w_800/gal-800.jpg 800w" alt="cdn">
<!-- Descriptor-less srcset -->
<img class="main" srcset="/img/mid-1200.jpg, /img/gal-800.jpg" src="/img/mid-1200.jpg" alt="plain">
<!-- Hidden tracking pixel, no width attribute -->
<img src="/img/blank.gif" style="display:none" alt="">
</body></html>
