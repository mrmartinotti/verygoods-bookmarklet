<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>5 Panel Hat Business Model</title>
<meta property="og:image" content="/img/og-product-hero.jpg">
<style>
  .hero { width: 900px; height: 500px; background-image: url('/img/bg-hero.jpg'); }
  .small-bg { width: 120px; height: 120px; background-image: url('/img/tiny-bg.png'); }
  img.lazy { width: 640px; height: 640px; }
  img.gallery { width: 480px; height: 600px; }
  img.icon { width: 24px; height: 24px; }
  img.banner { width: 1200px; height: 60px; }
</style>
</head>
<body>

<div class="hero"></div>
<div class="small-bg"></div>

<!-- lazy-loaded product image: src is a placeholder, real URL in data-src -->
<img class="lazy" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
     data-src="/img/product-main-1600.jpg" alt="product">

<!-- srcset gallery image -->
<img class="gallery" srcset="/img/gal-400.jpg 400w, /img/gal-1200.jpg 1200w, /img/gal-800.jpg 800w"
     src="/img/gal-400.jpg" alt="gallery">

<picture>
  <source srcset="/img/pic-600.webp 600w, /img/pic-1400.webp 1400w" type="image/webp">
  <img class="gallery" src="/img/pic-fallback.jpg" alt="picture">
</picture>

<!-- should be filtered: too small -->
<img class="icon" src="/img/cart-icon.png" alt="icon">

<!-- should be filtered: extreme aspect ratio banner -->
<img class="banner" src="/img/wide-banner.jpg" alt="banner">

<!-- data-original style lazy loader -->
<img class="lazy" src="/img/blank.gif" data-original="/img/product-alt-view.jpg" alt="alt view">

</body>
</html>
